<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VpnGuard</title>
<style>
:root {
  --bg: #050b14; --nav: #07111d; --card: #0a1724; --row: #0e2032; --border: #1b3a52; --grid: #12293b;
  --text: #d3f1ff; --dim: #6f93ab; --accent: #39d0ff; --btn: #0c1d2d; --btn-h: #10293f; --input: #050f19;
  --ok: #2ee6a6; --warn: #ffab2e; --bad: #ff4d5e; --none: #34495c; --rx: #ffd23f; --tx: #c77dff; --vpn: #39d0ff; --zp: #ff8a3d; --lan: #9fb3c8;
  --hud-grid: rgba(57, 208, 255, .035); --hud-line: rgba(57, 208, 255, .25); --hud-sel: rgba(57, 208, 255, .14); --hud-card2: #081320; --hud-on-accent: #031019;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); }
.app { display: flex; min-height: 100vh; }
nav { width: 210px; flex: none; background: var(--nav); border-right: 1px solid var(--border); padding: 14px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { padding: 0 20px 14px; font-weight: 600; font-size: 18px; }
.logo small { display: block; font-weight: 400; font-size: 12px; color: var(--dim); }
nav a { display: flex; align-items: center; justify-content: space-between; padding: 9px 20px; color: var(--dim); text-decoration: none; border-left: 3px solid transparent; }
nav a:hover { background: var(--row); color: var(--text); }
nav a.sel { color: var(--text); background: var(--card); border-left-color: var(--accent); }
nav hr { border: 0; border-top: 1px solid var(--border); margin: 8px 18px; }
main { flex: 1; min-width: 0; padding: 18px 22px 40px; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; }
.sub { color: var(--dim); font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.sec { color: var(--dim); font-weight: 600; margin: 16px 0 6px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .t { color: var(--dim); font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.tile .s { font-weight: 600; font-size: 16px; margin: 6px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .d { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; background: var(--none); }
.l0 { background: var(--ok); } .l1 { background: var(--warn); } .l2 { background: var(--bad); }
.c0 { color: var(--ok); } .c1 { color: var(--warn); } .c2 { color: var(--bad); } .c-1 { color: var(--dim); }
.hero { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-start; }
.hero .big { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.hsplit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 12px; }
.hsplit .hev { margin-bottom: 12px; display: flex; flex-direction: column; min-height: 0; }
.hsplit .hev pre { margin: 0; white-space: pre-wrap; font-size: 12px; max-height: 320px; overflow: auto; }
@media (min-width: 1500px) { .hsplit { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } .hsplit .hev pre { max-height: none; flex: 1 1 0; } }
button, select, input[type=text], input[type=password] { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; }
input[type=text], input[type=password], select { background: var(--input); }
button { cursor: pointer; } button:hover { background: var(--btn-h); }
button.p { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 8px; }
td { padding: 6px 8px; border-top: 1px solid var(--grid); vertical-align: top; }
tr.cur td { background: var(--row); } tr.cur td:first-child { box-shadow: inset 3px 0 var(--accent); }
.kv td:first-child { color: var(--dim); width: 38%; }
.tl { display: flex; height: 16px; border-radius: 3px; overflow: hidden; background: var(--row); }
.tl i { flex: 1; min-width: 1px; }
.tl i.l-1 { background: var(--none); }
.tlx { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 3px; }
pre, textarea.log { font: 12px/1.4 Consolas, monospace; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-word; }
textarea.log { width: 100%; height: 60vh; resize: vertical; }
.bar { height: 8px; background: var(--btn); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; }
canvas { width: 100%; height: 190px; display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--dim); }
#flowhost { overflow-x: auto; }
.flow svg { width: 100%; min-width: 820px; height: auto; display: block; }
.flow text { fill: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
.flow .f1 { font-size: 13px; font-weight: 600; } .flow .f2 { font-size: 12px; font-variant-numeric: tabular-nums; } .flow .f3 { font-size: 11px; fill: var(--dim); }
.flow .frx, .legend .frx { fill: var(--rx); color: var(--rx); } .flow .ftx, .legend .ftx { fill: var(--tx); color: var(--tx); }
.fl-node { fill: var(--row); stroke: var(--border); stroke-width: 1; }
.flow a:hover .fl-node { stroke: var(--accent); }
.fl-base { fill: none; stroke: var(--border); stroke-width: 1; opacity: .5; }
.fl-grp { fill: var(--accent); fill-opacity: .05; stroke: var(--accent); stroke-opacity: .45; stroke-dasharray: 5 4; }
.flow .fgl { font-size: 10px; fill: var(--accent); letter-spacing: .08em; }
.fl-sp { fill: none; stroke-width: 1.2; stroke-linejoin: round; } .fl-sp.rx { stroke: var(--rx); } .fl-sp.tx { stroke: var(--tx); opacity: .8; }
.fl-spb { stroke: var(--border); stroke-width: 1; opacity: .6; }
.fl-btn { cursor: pointer; } .fl-btn rect { fill: var(--card, var(--row)); stroke: var(--accent); stroke-opacity: .6; }
.fl-btn text { font-size: 11px; fill: var(--accent); } .fl-btn:hover rect { fill: var(--accent); fill-opacity: .25; stroke-opacity: 1; }
.fl-btn.bad rect { stroke: var(--bad); } .fl-btn.bad text { fill: var(--bad); }
.busy .fl-node { stroke: var(--accent) !important; stroke-width: 1.6; stroke-dasharray: 8 5; animation: flBusy .8s linear infinite; }
.busy .f3 { fill: var(--accent); }
@keyframes flBusy { to { stroke-dashoffset: -13; } }
.flow .fl-chv { font: bold 10px Consolas, "Courier New", monospace; letter-spacing: 5.5px; dominant-baseline: central; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; max-width: 420px; display: none; box-shadow: 0 4px 18px rgba(0,0,0,.3); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.modal .card { max-width: 860px; width: 100%; max-height: 92vh; overflow: auto; }
.qr { background: #fff; padding: 8px; border-radius: 6px; width: 260px; max-width: 100%; }
.err { color: var(--bad); } .muted { color: var(--dim); }
.login { max-width: 360px; margin: 12vh auto; }
.menu-btn { display: none; }
@media (max-width: 760px) {
  nav { position: fixed; z-index: 4; left: -230px; transition: left .2s; width: 220px; }
  nav.open { left: 0; }
  .menu-btn { display: inline-block; }
  main { padding: 12px 16px 40px; }
  .kv td:first-child { width: 45%; }
  .hide-m { display: none; }
}
/* ---------------------------------------------------------------- оформление HUD: скошенные углы, сетка, плашки, свечение */
:root { --hud-font: Bahnschrift, "Bahnschrift SemiCondensed", "DIN Alternate", "Segoe UI", system-ui, sans-serif; --cut: 10px; --glow: 0 0 10px rgba(57, 208, 255, .25); }
body { background-color: var(--bg);
  background-image: linear-gradient(var(--hud-grid) 1px, transparent 1px), linear-gradient(90deg, var(--hud-grid) 1px, transparent 1px);
  background-size: 34px 34px; background-attachment: fixed; }
h1, .logo, .sec, .tile .t, .kpi .v, .hero .big, th, button, nav a, .legend, .tlx { font-family: var(--hud-font); }
h1 { text-transform: uppercase; letter-spacing: .12em; font-size: 20px; color: var(--accent); text-shadow: var(--glow); }
.logo { letter-spacing: .14em; text-transform: uppercase; }
.logo b { color: var(--accent); font-weight: 600; text-shadow: var(--glow); }
.logo small { letter-spacing: .08em; font-family: var(--hud-font); }
.logo small::before { content: "// "; color: var(--accent); }
nav { background: linear-gradient(180deg, var(--nav), var(--bg)); border-right: 1px solid var(--border); box-shadow: inset -1px 0 0 var(--hud-line); }
nav a { text-transform: uppercase; letter-spacing: .08em; font-size: 13px; margin: 2px 10px 2px 0; border-left: 3px solid transparent;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
nav a.sel { color: var(--accent); background: linear-gradient(90deg, var(--hud-sel), transparent); border-left-color: var(--accent); }
nav hr { border-top: 1px dashed var(--border); }

/* панели: скошенные углы, цветной уголок, внутренняя линия */
.card, .tile, .modal .card {
  border: 0; border-radius: 0; position: relative;
  background: linear-gradient(180deg, var(--card), var(--hud-card2));
  box-shadow: inset 0 0 0 1px var(--border);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
.card::before, .tile::before { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 10px; background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 0 100%); opacity: .85; }
.card::after, .tile::after { content: ""; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; background: var(--accent);
  clip-path: polygon(100% 0, 100% 100%, 0 100%); opacity: .5; }
.tile:hover { box-shadow: inset 0 0 0 1px var(--accent), var(--glow); }
.tile .t { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.tile .s { font-family: var(--hud-font); letter-spacing: .02em; }
.kpi .v { font-size: 21px; white-space: nowrap; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: var(--glow); }

/* главная плашка: «опасная» полоса слева; цвет — по общему состоянию (st0 норма, st1 предупреждения, st2 сбой) */
.card.hero { padding-left: 26px; --st: var(--accent); }
.card.hero.st0 { --st: var(--ok); } .card.hero.st1 { --st: var(--warn); } .card.hero.st2 { --st: var(--bad); }
.card.hero.st0, .card.hero.st1, .card.hero.st2 { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st) 55%, transparent), inset 40px 0 60px -40px color-mix(in srgb, var(--st) 22%, transparent); }
.card.hero.st2 { animation: heroPulse 2.4s ease-in-out infinite; }
@keyframes heroPulse { 50% { box-shadow: inset 0 0 0 1px var(--st), inset 60px 0 80px -40px color-mix(in srgb, var(--st) 32%, transparent); } }
.card.hero::before { width: 8px; height: 100%; opacity: .9;
  background: repeating-linear-gradient(135deg, var(--st) 0 6px, transparent 6px 12px); clip-path: none; }
.card.hero::after { background: var(--st); }
@media (prefers-reduced-motion: reduce) { .card.hero.st2 { animation: none; } }
.hero .big { text-transform: uppercase; letter-spacing: .08em; font-size: 24px; }

/* заголовки разделов — плашка с линией до края */
.sec { display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--accent); margin: 20px 0 8px; }
.sec::before { content: ""; flex: none; width: 14px; height: 8px; background: linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 8px, var(--accent) 8px); opacity: .9; }
.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); opacity: .5; }

/* кнопки и поля */
button { text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; white-space: nowrap; border: 0; border-radius: 0; padding: 8px 14px;
  background: var(--btn); color: var(--text); box-shadow: inset 0 0 0 1px var(--border);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
button:hover { background: var(--btn-h); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
button.p { background: var(--accent); color: var(--hud-on-accent); box-shadow: none; font-weight: 600; }
button.p:hover { filter: brightness(1.12); color: var(--hud-on-accent); }
select, input[type=text], input[type=password] { border-radius: 0; border-color: var(--border); }
select:focus, input:focus, textarea:focus { outline: 1px solid var(--accent); outline-offset: 0; }
pre, textarea.log { border-radius: 0; border-color: var(--border); }

/* индикаторы и таблицы */
.dot { box-shadow: 0 0 0 2px var(--bg), 0 0 8px currentColor; }
.l0 { color: var(--ok); } .l1 { color: var(--warn); } .l2 { color: var(--bad); } .l-1 { color: transparent; }
.c0, .c1, .c2 { text-shadow: 0 0 10px currentColor; }
th { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--accent); opacity: .85; }
td { border-top: 1px solid var(--grid); }
tr.cur td:first-child { box-shadow: inset 3px 0 var(--accent); }
.tl { border-radius: 0; gap: 1px; background: transparent; }
.tl i { border-radius: 0; }
.bar { border-radius: 0; }
.legend b { border-radius: 0; }
#toast { border-radius: 0; border: 0; box-shadow: inset 0 0 0 1px var(--accent), var(--glow); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.flow .f1 { font-family: var(--hud-font); text-transform: uppercase; letter-spacing: .06em; }
.qr { border-radius: 0; }
@media (prefers-reduced-motion: no-preference) { .tile, button, nav a { transition: box-shadow .15s, background .15s, color .15s; } }
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="logo">Vpn<b>Guard</b><small id="ver">—</small></div>
    <a href="#home" data-p="home">Главная <span class="dot" data-d="inet" title="интернет"></span></a>
    <a href="#ultra" data-p="ultra">Туннель <span class="dot" data-d="ultra"></span></a>
    <a href="#meduza" data-p="meduza">MeduzaVPN <span class="dot" data-d="meduza"></span></a>
    <a href="#amnezia" data-p="amnezia">AmneziaVPN <span class="dot" data-d="amnezia"></span></a>
    <a href="#wg" data-p="wg">WG-Server <span class="dot" data-d="wg"></span></a>
    <a href="#ics" data-p="ics">Раздача ICS <span class="dot" data-d="ics"></span></a>
    <a href="#zapret" data-p="zapret">zapret <span class="dot" data-d="zapret"></span></a>
    <a href="#traffic" data-p="traffic">Трафик</a>
    <hr>
    <a href="#system" data-p="system">Компоненты и обновление</a>
    <a href="#settings" data-p="settings">Настройки</a>
    <a href="#logs" data-p="logs">Журнал</a>
    <a href="#diag" data-p="diag">Диагностика</a>
  </nav>
  <main>
    <header>
      <div class="row"><button class="menu-btn" onclick="nav.classList.toggle('open')">☰</button><h1 id="title">Главная</h1></div>
      <div class="row"><span class="dot" id="adot"></span><span class="sub" id="agent">загрузка…</span>
        <button onclick="cmd('check-now','проверка')">⟳ Проверить сейчас</button></div>
    </header>
    <div id="page"></div>
  </main>
</div>
<div id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="card" id="mbody"></div></div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, page = 'home', wgList = null, logCache = '', timer = null;
const NAMES = { home: 'Главная', ultra: 'Туннель', meduza: 'MeduzaVPN', amnezia: 'AmneziaVPN', wg: 'WG-Server', ics: 'Раздача интернета (ICS)', zapret: 'zapret-discord-youtube', traffic: 'Трафик', system: 'Компоненты и обновление', logs: 'Журнал', settings: 'Настройки', diag: 'Диагностика и доступ' };
const HKEY = { meduza: 'm', ultra: 'u', wg: 'w', ics: 'i', zapret: 'z', amnezia: 'a' };
const MODES = [['meduza', 'MeduzaVPN'], ['amnezia', 'AmneziaVPN'], ['dual', 'Два туннеля (с переключением)'], ['zapret', 'Без VPN — только zapret']];
const LV = { 0: 'работает', 1: 'предупреждение', 2: 'сбой', '-1': 'нет данных / выключено' };

// ---------------------------------------------------------------- сеть
async function api(path, body) {
  const o = body === undefined ? {} : { method: 'POST', headers: { 'X-VG': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, o);
  if (r.status === 401) { showLogin(); throw new Error('нужен вход'); }
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || data || ('HTTP ' + r.status));
  return data;
}
function toast(t, bad) { const e = $('#toast'); e.textContent = t; e.style.color = bad ? 'var(--bad)' : ''; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 4500); }
async function cmd(c, label, confirmText) {
  if (confirmText && !confirm(confirmText)) return false;
  try { await api('/api/cmd', { c }); toast('Отправлено агенту: ' + (label || c)); setTimeout(load, 2500); return true; } catch (e) { toast(e.message, true); return false; }
}
async function setCfg(key, value, label) {
  try { await api('/api/config', { key, value }); toast('Сохранено: ' + (label || key) + ' — агент применит на следующей проверке'); setTimeout(load, 2500); } catch (e) { toast(e.message, true); }
}
async function load() {
  try { S = await api('/api/status'); } catch (e) { $('#agent').textContent = 'нет связи с агентом: ' + e.message; return; }
  head(); render();
}

// ---------------------------------------------------------------- вход
function showLogin() {
  clearInterval(timer);
  document.body.innerHTML = `<div class="card login"><h1>VpnGuard</h1><p class="muted">Вход с другого устройства. Пароль — в окне VpnGuard (вкладка «Диагностика» → «Веб-интерфейс») или в веб-интерфейсе на самом ПК (вкладка «Диагностика»).</p>
  <div class="row"><input type="password" id="pw" placeholder="пароль" style="flex:1" autofocus><button class="p" id="go">Войти</button></div><p class="err" id="lerr"></p></div>`;
  const go = async () => {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
    if (r.ok) location.reload(); else { const j = await r.json().catch(() => ({})); $('#lerr').textContent = j.error || 'не удалось войти'; }
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ---------------------------------------------------------------- помощники отображения
const fmtB = b => { b = +b || 0; return b >= 1e9 ? (b / 1073741824).toFixed(2) + ' ГБ' : b >= 1e6 ? (b / 1048576).toFixed(1) + ' МБ' : (b / 1024).toFixed(0) + ' КБ'; };
const fmtR = v => { v = (+v || 0) * 8; return v >= 1e6 ? (v / 1e6).toFixed(1) + ' Мбит/с' : (v / 1e3).toFixed(0) + ' Кбит/с'; };
const ago = s => s < 0 ? 'не было' : s < 120 ? s + ' с назад' : s < 7200 ? Math.round(s / 60) + ' мин назад' : Math.round(s / 3600) + ' ч назад';
const comp = k => (S && S[k]) || null;
const lvl = o => o ? +o.level : -1;
function kvTable(o) { const rows = (o && o.kv) || []; if (!rows.length) return '<p class="muted">Нет данных.</p>'; return '<table class="kv">' + rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('') + '</table>'; }
function timeline(k) {

    <p class="muted">${w.requirePassword ? 'С этого ПК пароль не нужен никогда.' : 'Пароль не нужен из домашней сети и от клиентов WG-Server. Из интернета (если открыта удалённая диагностика «откуда угодно») пароль нужен всегда.'}</p>
    ${w.local && w.password ? `<p>Текущий пароль: <code>${esc(w.password)}</code></p>` : ''}
    <div class="row"><input type="password" id="newpw" placeholder="новый пароль (6–64 символа)" autocomplete="new-password">${btn('Сохранить пароль', 'setPw()')}</div>`;
}
async function setReqPw(on) {
  if (!on && !confirm('Отключить пароль? Веб-интерфейсом смогут управлять все устройства домашней сети и клиенты WG-Server.')) { loadWebSet(); return; }
  try { await api('/api/websettings', { requirePassword: on }); toast(on ? 'Пароль снова нужен' : 'Пароль в домашней сети не нужен'); } catch (e) { toast(e.message, true); }
  loadWebSet();
}
async function setPw() {
  const v = $('#newpw').value;
  try { await api('/api/websettings', { password: v }); toast('Пароль изменён — на других устройствах нужно войти заново'); } catch (e) { toast(e.message, true); }
  loadWebSet();
}
async function loadRemote() {
  let r; try { r = await api('/api/remote'); } catch (e) { $('#remote').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const addrs = [].concat(r.publicIp ? [`http://${r.publicIp}:${r.port}/  (через интернет — нужен проброс TCP ${r.port} на роутере)`] : [], (r.ips || []).map(a => `http://${a.ip}:${r.port}/  (сеть «${a.alias}»)`));
  const conn = r.enabled ? ['VpnGuard — удалённая диагностика (до ' + new Date(r.until).toLocaleString() + ')'].concat(addrs, ['Токен: ' + r.token, `Пример: curl -H "X-Token: ${r.token}" http://АДРЕС:${r.port}/bundle`]).join('\n') : '';
  $('#remote').innerHTML = r.enabled
    ? `<p><span class="dot l0"></span> <b>Включена</b> до ${esc(new Date(r.until).toLocaleString())} · ${r.allowFrom === 'local' ? 'только домашняя сеть и WG-Server' : 'откуда угодно'} · тесты и переподключения ${r.allowActions ? 'разрешены' : 'запрещены'} · запросов: ${r.requests}</p>
       <pre id="conn">${esc(conn)}</pre><div class="row">${btn('Скопировать данные для подключения', "navigator.clipboard.writeText($('#conn').textContent).then(()=>toast('Скопировано — отправьте вместе с сообщением'))", true)}${btn('Выключить', 'setRemote(false)')}</div>`
    : `<p class="muted">Выключена. По адресу ПК и токену можно будет читать состояние, журналы, сеть и запускать проверки. Ключи скрыты, выключается сама по таймеру.</p>
       <div class="row"><select id="rhours"><option value="2">на 2 ч</option><option value="8">на 8 ч</option><option value="24" selected>на 24 ч</option><option value="72">на 72 ч</option></select>
       <select id="rfrom"><option value="local">только домашняя сеть и WG-Server</option><option value="any">откуда угодно (через интернет)</option></select>
       <label class="row" style="gap:6px"><input type="checkbox" id="ract"> разрешить тесты и переподключения</label>${btn('Включить', 'setRemote(true)', true)}</div>`;
}
async function setRemote(on) {
  const b = on ? { enable: true, hours: +$('#rhours').value, allowFrom: $('#rfrom').value, allowActions: $('#ract').checked } : { enable: false };
  if (on && b.allowFrom === 'any' && !confirm('Открыть доступ из интернета? Соединение не шифруется; нужен проброс порта на роутере.')) return;
  try { await api('/api/remote', b); toast(on ? 'Удалённая диагностика включена' : 'Удалённая диагностика выключена'); } catch (e) { toast(e.message, true); }
  setTimeout(loadRemote, 1500);
}
async function runDiag() {
  $('#dstate').textContent = 'собираю… (до минуты)'; const t0 = Date.now();
  try { diagText = await api('/api/diag-run', {}); $('#dtext').textContent = diagText; $('#dstate').textContent = `готово за ${Math.round((Date.now() - t0) / 1000)} с`; } catch (e) { $('#dstate').textContent = e.message; }
}
function dlText(fn, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = fn; a.click(); }
P.logs = () => `<div class="card row"><select id="lmin" onchange="loadLog()"><option value="60">за 1 час</option><option value="360">за 6 часов</option><option value="1440" selected>за сутки</option><option value="4320">за 3 дня</option></select>
  <select id="llev" onchange="showLog()"><option value="">все</option><option value="WARN|ERROR">предупреждения и ошибки</option><option value="ERROR">только ошибки</option></select>
  <input type="text" id="lq" placeholder="поиск" oninput="showLog()">${btn('Обновить', 'loadLog()')}</div><textarea class="log" id="log" readonly></textarea>`;
P.logs.after = () => { if (!logCache) loadLog(); else showLog(); };
async function loadLog() { const m = +($('#lmin') || { value: 1440 }).value; try { logCache = await api(`/api/logs?minutes=${m}&days=${Math.ceil(m / 1440) + 1}&lines=6000`); showLog(); } catch (e) { toast(e.message, true); } }
function showLog() { const lev = $('#llev').value, q = $('#lq').value.toLowerCase(); let l = logCache.split('\n'); if (lev) l = l.filter(s => new RegExp('\\[(' + lev + ')\\]').test(s)); if (q) l = l.filter(s => s.toLowerCase().includes(q)); const t = $('#log'); t.value = l.reverse().join('\n'); }

// ---------------------------------------------------------------- отрисовка
function render(force) {
  if (!S) return;
  // во время ввода (выбор в списке, поиск) не перерисовывать
  const ae = document.activeElement; if (!force && ae && ['SELECT', 'INPUT', 'TEXTAREA'].includes(ae.tagName) && page !== 'home') return;
  if ((page === 'logs' && $('#log') || page === 'diag' && $('#remote') || page === 'settings' && $('#setbox')) && !force) return;
  const keep = page === 'zapret' && $('#zltext') ? { text: $('#zltext').value, sel: $('#zlsel') && $('#zlsel').value } : null;
  if (!force && page === 'home' && $('#hflow')) { $('#htop').innerHTML = P.home.top(); $('#htiles').innerHTML = P.home.tiles(); }   // схему и журнал не трогаем
  else $('#page').innerHTML = (P[page] || P.home)();
  for (const cv of document.querySelectorAll('canvas[data-chart]')) drawChart(cv, cv.dataset.chart);
  if (keep && keep.text !== undefined && zl) { loadZListsKeep(keep); } else if (P[page] && P[page].after) P[page].after();
}
function go() {
  page = (location.hash || '#home').slice(1); if (!P[page]) page = 'home';
  $('#title').textContent = NAMES[page];
  for (const a of document.querySelectorAll('nav a')) a.classList.toggle('sel', a.dataset.p === page);
  nav.classList.remove('open'); logCache = ''; render(true);
}
const nav = $('#nav');
window.addEventListener('hashchange', go);
window.addEventListener('resize', () => { for (const cv of document.querySelectorAll('canvas[data-chart]')) drawChart(cv, cv.dataset.chart); });
(async () => {
  try { const w = await (await fetch('/api/whoami')).json(); if (!w.role) { showLogin(); return; } } catch (e) { }
  await load(); go(); timer = setInterval(load, 3000); setInterval(liveTick, 1000);
})();
</script>
